<text x="40" y="96" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#102b46">Distributed AI foundation. Thin applications.</text>
<text x="40" y="131" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#334155">Cloud–Core–Edge solution blueprint | All integrations unbound | 01 October 2026</text>
