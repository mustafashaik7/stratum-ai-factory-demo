<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc"><title id="title">Stratum distributed AI architecture</title><desc id="desc">Cloud services connect to the Stratum core. Thin applications, enterprise systems and operators consume the core. Deploy, interconnect and extend in phases.</desc><rect width="1600" height="1080" fill="#f5f7fb"/>
